name: Theretailequation
description: >-
  The Retail Equation (TRE) is an Irvine, California software and analytics company that helps
  retailers detect and prevent fraudulent transactions and reduce return/exchange policy abuse. Its
  core Transaction Authorization service analyzes a shopper's linked purchase, return, and exchange
  history in real time and returns an approve, warn, or deny recommendation at the point of return —
  scoring transaction frequency, value, and receipt status while explicitly excluding demographic
  factors. TRE is part of Appriss Retail. The public web presence is a marketing and consumer-inquiry
  site plus an authenticated retailer Return Activity Report (RAR) portal; no public developer
  program, API documentation, SDKs, or OpenAPI surface is published.
